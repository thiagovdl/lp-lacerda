<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
    <title>Descubra seu plano ideal - LacerdaTEAM</title>
    <meta name="description" content="Responda 6 perguntas rápidas e descubra o plano LacerdaTEAM ideal para o seu objetivo.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="../ponto-inicial/style.css">
    <style>
        .quiz-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: radial-gradient(circle at 50% 30%, #1a0506 0%, #000 80%);
            padding: 40px 0;
        }

        .quiz-box {
            max-width: 640px;
            margin: 0 auto;
            width: 100%;
        }

        .quiz-brand {
            font-family: var(--font-heading);
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }

        .progress {
            height: 4px;
            background: #222;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress-bar {
            height: 100%;
            width: 0;
            background: var(--color-primary);
            box-shadow: 0 0 12px var(--color-primary-glow);
            transition: width 0.4s ease;
        }

        .step-count {
            color: #777;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .quiz-question {
            font-family: var(--font-heading);
            font-size: 1.7rem;
            line-height: 1.25;
            margin-bottom: 26px;
            color: #fff;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            text-align: left;
            background: var(--color-glass);
            border: 1px solid var(--color-glass-border);
            border-radius: 12px;
            color: var(--color-text);
            font-family: var(--font-body);
            font-size: 1.1rem;
            padding: 18px 20px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            gap: 14px;
            align-items: center;
        }

        .option:hover,
        .option:focus-visible {
            border-color: var(--color-primary);
            background: rgba(158, 28, 32, 0.12);
            outline: none;
        }

        .option .emoji {
            font-size: 1.5rem;
        }

        .back {
            background: none;
            border: none;
            color: #777;
            margin-top: 20px;
            cursor: pointer;
            font-family: var(--font-body);
            font-size: 0.95rem;
        }

        .back:hover {
            color: #fff;
        }

        .result {
            text-align: center;
        }

        .result .tag {
            display: inline-block;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #aaa;
            border: 1px solid #333;
            padding: 6px 12px;
            border-radius: 20px;
            margin-bottom: 16px;
        }

        .result h1 {
            font-family: var(--font-heading);
            font-size: 2.4rem;
            line-height: 1.1;
            margin-bottom: 18px;
        }

        .result p {
            color: #bbb;
            font-size: 1.1rem;
            margin-bottom: 14px;
        }

        .result .btn {
            margin-top: 18px;
        }

        .alt-link {
            display: block;
            margin-top: 22px;
            color: #888;
            font-size: 0.95rem;
        }

        .alt-link a {
            color: #fff;
        }

        .lead-form { display: flex; flex-direction: column; gap: 14px; text-align: left; }
        .lead-form label { color: #bbb; font-size: 0.95rem; display: flex; flex-direction: column; gap: 6px; }
        .lead-form input { background: var(--color-glass); border: 1px solid var(--color-glass-border); border-radius: 10px; color: #fff;
            font-family: var(--font-body); font-size: 1.1rem; padding: 15px 16px; outline: none; }
        .lead-form input:focus { border-color: var(--color-primary); }
        .lead-form .opt { color: #777; font-size: 0.85rem; }
        .lead-form .btn { margin-top: 6px; width: 100%; text-align: center; cursor: pointer; }
        .lead-error { color: #f87171; font-size: 0.9rem; min-height: 1.2em; }
        .lgpd { color: #777; font-size: 0.8rem; text-align: center; margin-top: 4px; }
        .contato-sub { color: #bbb; font-size: 1.05rem; margin: -12px 0 22px; }

        .hidden {
            display: none;
        }

        @media (max-width: 576px) {
            .quiz-question {
                font-size: 1.35rem;
            }

            .result h1 {
                font-size: 1.8rem;
            }
        }
    </style>
<!-- Meta Pixel -->
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
fbq('init','1050149673150383');fbq('track','PageView');
document.addEventListener('click',function(ev){var a=ev.target.closest&&ev.target.closest('a[href*="pay.kiwify.com.br"]');if(a)fbq('track','InitiateCheckout');},true);
</script>
<noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1050149673150383&ev=PageView&noscript=1"/></noscript>
<!-- End Meta Pixel -->
</head>

<body>
    <main class="quiz-page">
        <div class="container quiz-box">
            <div class="quiz-brand">Lacerda<span class="highlight">TEAM</span></div>
            <div class="progress"><div class="progress-bar" id="bar"></div></div>
            <div id="quiz"></div>
        </div>
    </main>

    <script>
        // ====== CONFIGURAÇÃO ======
        // Links de checkout (Kiwify). Preencha os protocolos quando tiver os links.
        // URL do script do Google que grava os leads na aba "Leads Quiz" da planilha de vendas
        const LEADS_URL = 'https://script.google.com/macros/s/AKfycbzcdBNMRjuQ-kMJ52B2gQgWRRPbmW8Qyb1CvbBu71c4CmdwsgaHndif691qm9t3x4P-/exec';

        const LINKS = {
            pontoInicial: '/ponto-inicial/',
            olimpo: '/protocolo-olimpo/',
            whatsapp: 'https://wa.me/5537935003570?text=' + encodeURIComponent('Oi Thiago! Fiz o teste no site e quero saber da consultoria individual.')
        };

        const PROTOCOLOS = {
            M: {
                definir: { slug: 'hermes', nome: 'Protocolo Hermes', desc: 'Corpo atlético, leve e definido.' },
                forca: { slug: 'ares', nome: 'Protocolo Ares', desc: 'Ombros largos, peitoral denso e braços fortes.' },
                massa: { slug: 'atlas', nome: 'Protocolo Atlas', desc: 'Foco total em ganho de massa muscular.' }
            },
            F: {
                definir: { slug: 'artemis', nome: 'Protocolo Ártemis', desc: 'Tônus muscular e baixo percentual de gordura.' },
                forca: { slug: 'atena', nome: 'Protocolo Atena', desc: 'Pernas torneadas, glúteos fortes e curvas.' },
                massa: { slug: 'gaia', nome: 'Protocolo Gaia', desc: 'Volume máximo de pernas e glúteos.' }
            }
        };

        const QUESTIONS = [
            {
                id: 'sexo', q: 'Pra começar: você é...',
                opts: [['F', '👩', 'Mulher'], ['M', '👨', 'Homem']]
            },
            {
                id: 'objetivo', q: 'Qual é o seu objetivo principal hoje?',
                opts: [['emagrecer', '🔥', 'Emagrecer e perder barriga'], ['definir', '⚡', 'Ficar definido(a) e atlético(a)'],
                ['forca', '🏋️', 'Ganhar força e formas (curvas / ombros)'], ['massa', '💪', 'Ganhar massa muscular']]
            },
            {
                id: 'experiencia', q: 'Há quanto tempo você treina?',
                opts: [['zero', '🌱', 'Não treino / estou parado(a)'], ['pouco', '📅', 'Menos de 6 meses'],
                ['medio', '📈', 'Entre 6 meses e 2 anos'], ['muito', '🏆', 'Mais de 2 anos']]
            },
            {
                id: 'local', q: 'Onde você vai treinar?',
                opts: [['academia', '🏢', 'Na academia'], ['casa', '🏠', 'Em casa']]
            },
            {
                id: 'dificuldade', q: 'O que mais te atrapalhou até hoje?',
                opts: [['dieta', '🍕', 'Não consigo manter dieta, sempre desisto'], ['comeco', '🧭', 'Não sei por onde começar'],
                ['resultado', '😤', 'Faço tudo e não vejo resultado'], ['tempo', '⏰', 'Falta de tempo e rotina corrida']]
            },
            {
                id: 'investimento', q: 'Quanto você estaria disposto(a) a investir por mês pra ter alguém te acompanhando de perto?',
                opts: [['baixo', '🌱', 'Prefiro começar com algo de baixo custo'], ['ate150', '💵', 'Até R$150 por mês'],
                ['200a300', '💳', 'Entre R$200 e R$300 por mês'], ['mais300', '🚀', 'Mais de R$300 por mês']]
            }
        ];

        const TXT = {
            sexo: { F: 'mulher', M: 'homem' },
            objetivo: { emagrecer: 'emagrecer', definir: 'ficar definido(a)', forca: 'ganhar força e formas', massa: 'ganhar massa muscular' },
            experiencia: { zero: 'não treino / estou parado(a)', pouco: 'treino há menos de 6 meses', medio: 'treino entre 6 meses e 2 anos', muito: 'treino há mais de 2 anos' },
            local: { academia: 'na academia', casa: 'em casa' },
            dificuldade: { dieta: 'não consigo manter dieta', comeco: 'não sei por onde começar', resultado: 'faço tudo e não vejo resultado', tempo: 'falta de tempo' },
            investimento: { baixo: 'algo de baixo custo', ate150: 'até R$150/mês', '200a300': 'R$200 a R$300/mês', mais300: 'mais de R$300/mês' }
        };

        function whatsappComRespostas() {
            const a = answers;
            const msg = 'Oi Thiago! ' + (a.nome ? 'Aqui é ' + a.nome.split(' ')[0] + '. ' : '') + 'Fiz o teste no site. Sou ' + TXT.sexo[a.sexo] + ', quero ' + TXT.objetivo[a.objetivo] +
                ', ' + TXT.experiencia[a.experiencia] + ' (' + TXT.local[a.local] + '). O que mais me atrapalha: ' +
                TXT.dificuldade[a.dificuldade] + '. Posso investir ' + TXT.investimento[a.investimento] + '. Quero saber da consultoria!';
            return 'https://wa.me/5537935003570?text=' + encodeURIComponent(msg);
        }

        const MSG_DIFICULDADE = {
            dieta: 'Você disse que sempre desiste da dieta. Por isso aqui você aprende a encaixar o que gosta (até hambúrguer) no plano, em vez de cortar tudo.',
            comeco: 'Você disse que não sabe por onde começar. Aqui você recebe o passo a passo pronto: o que comer e como treinar.',
            resultado: 'Você disse que faz tudo e não vê resultado. Geralmente o problema é método, não esforço, e é isso que vamos ajustar.',
            tempo: 'Você disse que a rotina é corrida. O plano foi pensado pra caber na vida real, sem marmita o dia inteiro.'
        };

        const answers = {};
        let step = 0;
        const el = document.getElementById('quiz');
        const bar = document.getElementById('bar');

        function track(event, params) {
            try { if (window.fbq) fbq('track', event, params || {}); } catch (e) { }
        }

        function render() {
            bar.style.width = (step / QUESTIONS.length * 100) + '%';
            if (step >= QUESTIONS.length) return answers.contatoOk ? renderResult() : renderContato();
            const item = QUESTIONS[step];
            el.innerHTML = `
                <div class="step-count">Pergunta ${step + 1} de ${QUESTIONS.length}</div>
                <h2 class="quiz-question">${item.q}</h2>
                <div class="options">
                    ${item.opts.map(([v, e, t]) => `<button class="option" data-v="${v}"><span class="emoji">${e}</span>${t}</button>`).join('')}
                </div>
                ${step > 0 ? '<button class="back" id="back">← Voltar</button>' : ''}`;
            el.querySelectorAll('.option').forEach(b => b.addEventListener('click', () => {
                answers[item.id] = b.dataset.v;
                step++;
                render();
            }));
            const back = document.getElementById('back');
            if (back) back.addEventListener('click', () => { step--; render(); });
        }

        function renderResult() {
            const inv = answers.investimento;
            if (inv === '200a300' || inv === 'mais300') return renderConsultoria();
            if (inv === 'ate150') return renderPontoInicial();
            const iniciante = ['zero', 'pouco'].includes(answers.experiencia);
            const objetivo = answers.objetivo === 'emagrecer' ? 'definir' : answers.objetivo;
            const p = PROTOCOLOS[answers.sexo][objetivo];
            const extra = MSG_DIFICULDADE[answers.dificuldade] || '';
            
            const base = iniciante
                ? 'Como você está começando (ou recomeçando), siga o protocolo no seu ritmo: as cargas e a intensidade se adaptam ao seu nível.'
                : 'Você já tem base de treino, então pode ir direto para um protocolo focado no seu objetivo.';
            el.innerHTML = `
                <div class="result">
                    <span class="tag">Seu resultado</span>
                    <h1>Seu plano ideal é o <span class="highlight">${p.nome}</span></h1>
                    <p>${p.desc} ${base}</p>
                    <p>${extra}</p>
                    <a class="btn hero-cta" href="${LINKS.olimpo}#${p.slug}">QUERO MEU PROTOCOLO · R$27</a>
                    <span class="alt-link">Quer ir além do protocolo? <a href="${LINKS.pontoInicial}">Conheça o Ponto Inicial</a>, com aulas sobre alimentação, treino e mentalidade</span>
                    <span class="alt-link">Quer um plano 100% individual? <a href="${whatsappComRespostas()}" target="_blank" rel="noopener">Fale sobre a consultoria</a></span>
                </div>`;
        }

        function renderConsultoria() {
            const extra = MSG_DIFICULDADE[answers.dificuldade] || '';
            
            el.innerHTML = `
                <div class="result">
                    <span class="tag">Seu resultado</span>
                    <h1>Seu perfil é para o <span class="highlight">acompanhamento individual</span></h1>
                    <p>Pelas suas respostas, o que vai fazer diferença pra você é um plano 100% seu, com dieta, treino e ajustes de perto, e não um material pronto.</p>
                    <p>${extra}</p>
                    <a class="btn hero-cta" href="${whatsappComRespostas()}" target="_blank" rel="noopener">FALAR COM O THIAGO NO WHATSAPP</a>
                    <span class="alt-link">Suas respostas já vão na mensagem, é só enviar.</span>
                    <span class="alt-link">Prefere começar sozinho(a)? <a href="${LINKS.olimpo}">Veja os protocolos de R$27</a></span>
                </div>`;
        }

        function renderPontoInicial() {
            const extra = MSG_DIFICULDADE[answers.dificuldade] || '';
            
            el.innerHTML = `
                <div class="result">
                    <span class="tag">Seu resultado</span>
                    <h1>Seu plano ideal é o <span class="highlight">Ponto Inicial</span></h1>
                    <p>Aulas curtas sobre alimentação, treino e mentalidade, com plano alimentar flexível e ficha de treino em PDF. Um bom começo pra quem quer resultado sem gastar muito.</p>
                    <p>${extra}</p>
                    <a class="btn hero-cta" href="${LINKS.pontoInicial}">CONHECER O PONTO INICIAL</a>
                    <span class="alt-link">Quer algo ainda mais simples? <a href="${LINKS.olimpo}">Veja os protocolos de R$27</a></span>
                    <span class="alt-link">Quer um plano 100% individual? <a href="${whatsappComRespostas()}" target="_blank" rel="noopener">Fale sobre a consultoria</a></span>
                </div>`;
        }

        function destino() {
            const inv = answers.investimento;
            if (inv === '200a300' || inv === 'mais300') return 'Consultoria (WhatsApp)';
            if (inv === 'ate150') return 'Ponto Inicial';
            const objetivo = answers.objetivo === 'emagrecer' ? 'definir' : answers.objetivo;
            return PROTOCOLOS[answers.sexo][objetivo].nome;
        }

        function utm() {
            try {
                const q = new URLSearchParams(location.search);
                const partes = ['utm_source', 'utm_campaign', 'utm_content'].map(k => q.get(k)).filter(Boolean);
                return partes.length ? partes.join(' / ') : (q.get('fbclid') ? 'Meta (anúncio)' : 'Direto');
            } catch (e) { return ''; }
        }

        function enviarLead() {
            const a = answers;
            const dados = {
                nome: a.nome, whatsapp: a.whatsapp, instagram: a.instagram || '',
                sexo: TXT.sexo[a.sexo], objetivo: TXT.objetivo[a.objetivo], experiencia: TXT.experiencia[a.experiencia],
                local: TXT.local[a.local], dificuldade: TXT.dificuldade[a.dificuldade], investimento: TXT.investimento[a.investimento],
                resultado: destino(), origem: utm()
            };
            if (!LEADS_URL) return;
            try {
                fetch(LEADS_URL, { method: 'POST', mode: 'no-cors', keepalive: true,
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(dados) });
            } catch (e) { }
        }

        function renderContato() {
            bar.style.width = '100%';
            el.innerHTML = `
                <div class="step-count">Último passo</div>
                <h2 class="quiz-question">Seu resultado está pronto! 🎯</h2>
                <p class="contato-sub">Deixa seu nome e WhatsApp pra gente te mostrar o plano ideal pra você.</p>
                <form class="lead-form" id="leadForm" novalidate>
                    <label>Seu nome
                        <input type="text" id="fNome" autocomplete="name" placeholder="Como você se chama?" maxlength="80" value="${answers.nome || ''}">
                    </label>
                    <label>Seu WhatsApp
                        <input type="tel" id="fZap" autocomplete="tel" inputmode="tel" placeholder="(37) 99999-9999" maxlength="20" value="${answers.whatsapp || ''}">
                    </label>
                    <label><span>Seu Instagram <span class="opt">(opcional)</span></span>
                        <input type="text" id="fInsta" placeholder="@seuperfil" maxlength="40" value="${answers.instagram || ''}">
                    </label>
                    <div class="lead-error" id="fErro"></div>
                    <button type="submit" class="btn hero-cta">VER MEU RESULTADO</button>
                    <p class="lgpd">Ao continuar, você aceita receber contato da LacerdaTEAM pelo WhatsApp. Seus dados não são compartilhados com ninguém.</p>
                </form>
                <button class="back" id="back">← Voltar</button>`;
            const zap = document.getElementById('fZap');
            zap.addEventListener('input', () => {
                let d = zap.value.replace(/\D/g, '').slice(0, 11);
                if (d.length > 6) zap.value = '(' + d.slice(0, 2) + ') ' + d.slice(2, d.length - 4) + '-' + d.slice(-4);
                else if (d.length > 2) zap.value = '(' + d.slice(0, 2) + ') ' + d.slice(2);
                else zap.value = d;
            });
            document.getElementById('back').addEventListener('click', () => { step--; render(); });
            document.getElementById('leadForm').addEventListener('submit', (ev) => {
                ev.preventDefault();
                const nome = document.getElementById('fNome').value.trim();
                const digitos = zap.value.replace(/\D/g, '');
                let insta = document.getElementById('fInsta').value.trim();
                const erro = document.getElementById('fErro');
                if (nome.length < 2) { erro.textContent = 'Digite seu nome.'; return; }
                if (digitos.length < 10 || digitos.length > 11) { erro.textContent = 'Digite seu WhatsApp com DDD.'; return; }
                if (insta && !insta.startsWith('@')) insta = '@' + insta;
                answers.nome = nome; answers.whatsapp = zap.value; answers.instagram = insta; answers.contatoOk = true;
                enviarLead();
                track('Lead', { content_name: destino() });
                render();
            });
        }

        render();
    </script>
</body>

</html>
